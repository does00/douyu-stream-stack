# 每次推 main,自动把 4 个自建服务打成镜像推到 GHCR,供开箱即用部署:
#   docker compose -f https://raw.githubusercontent.com/does00/douyu-stream-stack/main/docker-compose.ghcr.yml up -d
# 注意:GHCR 新包首次发布默认为私有,需到各包设置页手动改为公开,上面的一键命令才无需登录可用。
name: Build and publish images

on:
  push:
    branches: [main]
    paths:
      - 'grid-stream/**'
      - 'stream-proxy/**'
      - 'stream-manager/**'
      - 'douyu-multiview/**'
      - '.github/workflows/docker-publish.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: grid-stream
            context: grid-stream
          - service: stream-proxy
            context: stream-proxy
          - service: stream-manager
            context: stream-manager
          - service: douyu-multiview
            context: douyu-multiview
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/does00/douyu-stream-stack-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
